<!DOCTYPE html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0D6EFD" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="googlebot" content="index, follow, max-image-preview:large" />
    <script>
      (() => {
        try {
          const saved = localStorage.getItem("xion_theme");
          const dark = saved
            ? saved === "dark"
            : matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.dataset.theme = dark ? "dark" : "light";
          document.querySelector('meta[name="theme-color"]').content = dark
            ? "#0B1017"
            : "#0D6EFD";
        } catch {}
      })();
    </script>
    <link
      rel="preload"
      as="image"
      href="/media/xion-products/hero-catalog.webp"
      fetchpriority="high"
    />

      content="XION — akusherlik, ginekologiya va urologiya uchun tibbiy buyumlar katalogi, buyurtma va jonli mutaxassis yordami."
    />

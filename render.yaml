services:
  - type: web
    name: nova-api
    runtime: node
    buildCommand: npm ci --include=dev && npm run db:generate -w @nova/api && npm run check -w @nova/api && npm run build -w @nova/web
    startCommand: npm run start -w @nova/api
    healthCheckPath: /api/v1/health
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - apps/api/**
        - apps/web/**
        - package.json
        - package-lock.json
        - render.yaml
        - .node-version
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.22.0
      - key: CLIENT_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: TELEGRAM_WEBHOOK_URL
        sync: false
      - key: TELEGRAM_WEBAPP_URL
        value: https://nove-chat.onrender.com/operator
      - key: TELEGRAM_RETRY_LIMIT
        value: 5
